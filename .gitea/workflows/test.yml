name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p390
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DATABASE: p390
      PG_USER: postgres
      PG_PASSWORD: test123
      JWT_SECRET: ci-test-secret
      UPSTREAM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run seed
      - run: npm test
      - name: Start server + smoke
        run: |
          node server.js &
          sleep 3
          npm run test:smoke
