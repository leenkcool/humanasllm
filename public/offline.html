<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex">
  <title>离线 · Human as Agent</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-weak: #eff4ff;
      --radius: 16px;
      --shadow: 0 20px 50px rgba(15, 23, 42, .10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --surface: #1b1e26;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2c313c;
        --primary: #60a5fa;
        --primary-weak: #1e2a3a;
        --shadow: 0 20px 50px rgba(0, 0, 0, .5);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(16px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 28px 32px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--primary-weak);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
    .en {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .desc {
      font-size: 14px;
      color: var(--muted);
      margin-top: 18px;
    }
    .desc + .desc { margin-top: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      min-width: 140px;
      margin-top: 26px;
      padding: 10px 22px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: filter .15s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .hint {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 6px;
      vertical-align: middle;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="offlineTitle">
    <div class="logo" aria-hidden="true">
      <!-- 机器人轮廓：与工作台侧栏 logo 同一图形语言 -->
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <circle cx="12" cy="5" r="2"/>
        <path d="M12 7v4"/>
        <line x1="8" y1="16" x2="8" y2="16"/>
        <line x1="16" y1="16" x2="16" y2="16"/>
      </svg>
    </div>

    <h1 id="offlineTitle">当前离线</h1>
    <p class="en">You are offline</p>

    <p class="desc">网络连接已断开，暂时无法加载最新内容。</p>
    <p class="desc">网络恢复后刷新页面即可继续使用，已登录状态不会丢失。</p>

    <button class="btn" type="button" onclick="location.reload()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      重试
    </button>

    <p class="hint">
      <span class="dot" aria-hidden="true"></span>离线页由本地 Service Worker 提供，不依赖服务器
    </p>
  </main>
</body>
</html>
